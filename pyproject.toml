[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart_vision"
version = "0.1.0"
description = "General-purpose smart vision sensor: edge-optimized object detection that outputs structured events"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
