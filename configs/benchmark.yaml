project: smart-vision-sensor
seed: 2026

paths:
  data_root: data            # local default; on Kaggle pass --data-root /kaggle/working/data
  models_dir: models
  results_root: results

dataset:
  name: coco2017
  val_images_url: http://images.cocodataset.org/zips/val2017.zip
  annotations_url: http://images.cocodataset.org/annotations/annotations_trainval2017.zip
  train_image_base_url: http://images.cocodataset.org/train2017/
  expected_val_images: 5000
  expected_categories: 80

calibration:
  source_split: train2017    # never val2017, to avoid leakage
  num_images: 500
  min_annotations_per_image: 1
  manifest: configs/manifests/calibration_train2017.json

experiment:
  models: [yolo11n, yolo11s, yolo26n, yolo26s]
  imgsz: [320, 416, 512, 640]
  formats: [pytorch_fp32, onnx_fp32, onnx_fp16, onnx_int8, onnx_int8_mixed]
  cpu_threads: [1, 2, 4]

evaluation:
  max_images: null           # null = full val2017 (5000 images); use 500 for quick runs
  conf: 0.001
  iou: 0.7

latency:
  n_images: 50
  warmup_runs: 20
  timed_runs: 200

robustness:
  corruptions: [blur, dark, noise, occlusion, jpeg]
  max_images: 1000

adaptive:
  thresholds: [1.0, 2.0, 4.0]
  max_skip: [5, 10]
  tolerance_frames: 10

sensor:
  classes: null            # null = all 80 COCO classes (general-purpose sensor)
  min_confidence: 0.25
  confirm_frames: 3        # frames a track must be seen before an "appeared" event
  lost_frames: 5           # frames a track may be missing before "disappeared"
